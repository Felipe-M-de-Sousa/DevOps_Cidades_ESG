spring:
  application:
    name: ecosmart-api
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/ecosmart_porto_verde}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  file:
    path: ${LOG_PATH:./logs}

ecosmart:
  ambiente: ${APP_ENV:local}
  seed: ${SEED_DATA:false}
